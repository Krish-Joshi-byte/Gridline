server.port=${PORT:3001}
elevenlabs.webhook.secret=${ELEVENLABS_WEBHOOK_SECRET:}

# Optional shared secret for the live-call dispatch tool
# (POST /api/elevenlabs/dispatch-tool). Leave unset for local demo; set it
# and configure the same value as a header on the tool in the ElevenLabs
# dashboard once this is reachable from the public internet, or anyone who
# finds the URL could dispatch real units.
elevenlabs.tool.secret=${ELEVENLABS_TOOL_SECRET:}

# Agent the frontend connects to for the live in-browser voice call.
# ELEVENLABS_API_KEY is optional: leave it unset while the agent is
# "public" (no auth) in the ElevenLabs dashboard. Set it once you flip
# the agent to private/authenticated — the key never reaches the
# browser, it's only used server-side to mint a short-lived signed URL.
elevenlabs.agent.id=${ELEVENLABS_AGENT_ID:}
elevenlabs.api.key=${ELEVENLABS_API_KEY:}

# Origins allowed to call this API. Update if the frontend moves, add
# a staging URL, etc. Comma-separated, no trailing slashes.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://gridline.wiki,https://www.gridline.wiki,https://e.gridline.wiki,http://localhost:5173}

# Where the volunteer page keeps its posts and sign-ups (events.json,
# registrations.json). Relative paths are from the directory the backend is
# started in. Sign-ups contain names, emails and phone numbers. On a host with
# an ephemeral disk (Render's free tier) point this at a persistent volume or
# the files are lost on every deploy.
volunteer.data-dir=${VOLUNTEER_DATA_DIR:data/volunteer}
