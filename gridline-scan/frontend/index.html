<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Gridline Scan -- Floor Plan 3D Viewer (prototype)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  html,body{margin:0;height:100%;background:#0d1117;color:#e6edf3;font-family:system-ui,Arial,sans-serif;overflow:hidden}
  #panel{position:absolute;top:0;left:0;z-index:2;padding:14px 16px;background:rgba(13,17,23,.85);
         border-right:1px solid #22272e;border-bottom:1px solid #22272e;border-bottom-right-radius:10px;max-width:300px}
  #panel h1{font-size:15px;margin:0 0 8px}
  #panel p{font-size:12px;line-height:1.5;color:#9aa4af;margin:6px 0}
  #panel input[type=file]{font-size:12px}
  #meta{font-size:12px;margin-top:8px}
  #meta div{display:flex;justify-content:space-between;gap:12px;padding:2px 0;border-bottom:1px solid #1c2128}
  #warnings{margin-top:8px}
  #warnings li{font-size:11px;color:#e3b341;margin-bottom:4px}
  canvas{display:block}
  #hint{position:absolute;bottom:10px;left:14px;font-size:11px;color:#6e7681;z-index:2}
</style>
</head>
<body>
<div id="panel">
  <h1>Gridline Scan -- Floor Plan 3D</h1>
  <p>Load a <code>*.scene.json</code> produced by <code>FloorplanTo3D.java</code> (or the Python prototype).</p>
  <input type="file" id="fileInput" accept="application/json" />
  <div id="meta"></div>
  <ul id="warnings"></ul>
</div>
<div id="hint">Drag to orbit &middot; scroll to zoom &middot; right-drag to pan</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.05, 500);
camera.position.set(8, 10, 12);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x30363d, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(10, 20, 6);
scene.add(sun);

let content = new THREE.Group();
scene.add(content);

// Blue tiled floor grid, matching the project's reference visual language.
function buildFloorGrid(widthM, depthM) {
  const g = new THREE.Group();
  const tile = 1.0;
  const cols = Math.ceil(widthM / tile), rows = Math.ceil(depthM / tile);
  const geo = new THREE.PlaneGeometry(tile*0.96, tile*0.96);
  for (let r=0;r<rows;r++){
    for (let c=0;c<cols;c++){
      const mat = new THREE.MeshStandardMaterial({
        color: ((r+c)%2===0) ? 0x1f6feb : 0x2f81f7, roughness: 0.85, metalness: 0.05
      });
      const m = new THREE.Mesh(geo, mat);
      m.rotation.x = -Math.PI/2;
      m.position.set(c*tile + tile/2, 0, r*tile + tile/2);
      g.add(m);
    }
  }
  const grid = new THREE.GridHelper(Math.max(widthM,depthM)*1.2, Math.max(widthM,depthM)*1.2, 0x111827, 0x111827);
  grid.position.set(widthM/2, 0.001, depthM/2);
  g.add(grid);
  return g;
}

const ROOM_PALETTE = [0x2f81f7, 0x3fb950, 0xd29922, 0xf85149, 0xa371f7, 0x39c5cf,
                      0xff8c00, 0x00c878, 0xdc3ca0, 0x5a5aff];

// Rooms carry a cell footprint (scene v3+) because real rooms are rarely
// rectangles -- an L-shaped living/dining or a bathroom wrapped around a
// closet comes out completely wrong as a bounding box. Fall back to the
// bbox for older v1/v2 scene files, which have no cells.
function buildRooms(rooms, cellSizeM) {
  const g = new THREE.Group();
  rooms.forEach((r, i) => {
    const mat = new THREE.MeshStandardMaterial({
      color: ROOM_PALETTE[i % ROOM_PALETTE.length], transparent:true, opacity:0.38
    });
    const rects = roomRects(r, cellSizeM);
    if (rects.length) {
      const geo = new THREE.BoxGeometry(1, 1, 1);
      const mesh = new THREE.InstancedMesh(geo, mat, rects.length);
      const dummy = new THREE.Object3D();
      rects.forEach(([x, z, w, d], k) => {
        dummy.position.set(x + w/2, 0.01, z + d/2);
        dummy.scale.set(w, 0.02, d);
        dummy.updateMatrix();
        mesh.setMatrixAt(k, dummy.matrix);
      });
      g.add(mesh);
    } else {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(r.widthM, r.depthM), mat);
      m.rotation.x = -Math.PI/2;
      m.position.set(r.xM + r.widthM/2, 0.01, r.zM + r.depthM/2);
      g.add(m);
    }
  });
  return g;
}

function buildRoomLegend(rooms) {
  if (!rooms.length) return "";
  const rows = rooms.map((r, i) => {
    const hex = "#" + ROOM_PALETTE[i % ROOM_PALETTE.length].toString(16).padStart(6, "0");
    const sqft = r.areaSqFt != null ? ` (${Math.round(r.areaSqFt)} sqft)` : "";
    return `<li><span style="color:${hex}">&#9632;</span> ${r.label} &mdash; ${r.areaM2} m&sup2;${sqft}</li>`;
  }).join("");
  return `<ul style="list-style:none;padding:0;margin:8px 0;font-size:11px;color:#9aa4af">${rows}</ul>`;
}

// v4 scenes carry metre-space rectangles ("walls"); v3 and earlier carried a
// coarse cell grid. Normalise to rectangles so this page reads both.
function asRects(data, cellSizeM) {
  if (data.walls) return data.walls;
  return (data.wallCells || []).map(([c, r]) => [c*cellSizeM, r*cellSizeM, cellSizeM, cellSizeM]);
}
function roomRects(r, cellSizeM) {
  if (r.floor) return r.floor;
  return (r.cells || []).map(([c, rr]) => [c*cellSizeM, rr*cellSizeM, cellSizeM, cellSizeM]);
}

function buildWalls(rects, heightM) {
  const g = new THREE.Group();
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const mat = new THREE.MeshStandardMaterial({color:0x8b949e, roughness:0.9});
  const mesh = new THREE.InstancedMesh(geo, mat, Math.max(1, rects.length));
  const dummy = new THREE.Object3D();
  rects.forEach(([x,z,w,d], i) => {
    dummy.position.set(x + w/2, heightM/2, z + d/2);
    dummy.scale.set(w, heightM, d);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  });
  g.add(mesh);
  return g;
}

function loadScene(data) {
  scene.remove(content);
  content = new THREE.Group();

  const w = data.meta.widthM, d = data.meta.depthM;
  content.add(buildFloorGrid(w, d));
  const cellM = data.meta.wallCellSizeM || 0.2;
  content.add(buildRooms(data.rooms || [], cellM));
  content.add(buildWalls(asRects(data, cellM), data.meta.wallHeightM || 2.6));

  scene.add(content);
  controls.target.set(w/2, 0, d/2);
  camera.position.set(w*0.15, Math.max(w,d)*0.9, d*1.15);
  controls.update();

  const meta = document.getElementById("meta");
  meta.innerHTML = "";
  const rows = [
    ["Source", data.source_image || "-"],
    ["Size", `${w} x ${d} m`],
    ["Rooms", data.meta.roomCount],
    ["Wall pieces", data.meta.wallRectCount != null ? data.meta.wallRectCount : data.meta.wallCellCount],
    ["Scale", `${data.meta.pixelsPerMetre} px/m`],
  ];
  rows.forEach(([k,v]) => {
    const div = document.createElement("div");
    div.innerHTML = `<span>${k}</span><b>${v}</b>`;
    meta.appendChild(div);
  });
  meta.insertAdjacentHTML("beforeend", buildRoomLegend(data.rooms || []));
  const warn = document.getElementById("warnings");
  warn.innerHTML = "";
  (data.meta.warnings || []).forEach(w => {
    const li = document.createElement("li");
    li.textContent = "\u26A0 " + w;
    warn.appendChild(li);
  });
}

document.getElementById("fileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => loadScene(JSON.parse(reader.result));
  reader.readAsText(file);
});

// Try auto-loading a demo scene placed alongside this file, so the viewer
// isn't blank on first open (fails silently under file:// without a server).
fetch("./demo.scene.json").then(r => r.json()).then(loadScene).catch(() => {});

window.addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
