<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>apartment_2bed2bath_2d -- Gridline Scan 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#0b0f14; --panel:rgba(13,17,23,.92); --line:#222a33;
    --fg:#e6edf3; --muted:#9aa4af; --accent:#2f81f7; --warn:#e3b341;
  }
  /* The 3D scene is dark either way; these just keep the panel legible for a
     viewer whose browser or OS is set to light. */
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --panel:rgba(246,248,250,.94); --line:#d0d7de;
      --fg:#1f2328; --muted:#59636e; --warn:#9a6700;
    }
    :root:not([data-theme="dark"]) button{background:#fff;color:#1f2328}
    :root:not([data-theme="dark"]) li.room:hover{background:#eaeef2}
    :root:not([data-theme="dark"]) .row{border-bottom-color:#eaeef2}
  }
  :root[data-theme="light"]{
    --panel:rgba(246,248,250,.94); --line:#d0d7de;
    --fg:#1f2328; --muted:#59636e; --warn:#9a6700;
  }
  *{box-sizing:inherit}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;overflow:hidden}
  canvas{display:block}
  #panel{position:absolute;top:env(safe-area-inset-top,0px);left:0;z-index:3;
    width:290px;max-width:86vw;max-height:calc(100% - 20px);overflow-y:auto;
    padding:12px 14px;background:var(--panel);border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);border-bottom-right-radius:12px;
    backdrop-filter:blur(6px)}
  #panel h1{font-size:14px;margin:0 0 2px;letter-spacing:.2px}
  #panel .sub{font-size:11px;color:var(--muted);margin-bottom:10px}
  .grp{border-top:1px solid var(--line);padding-top:9px;margin-top:9px}
  .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:6px}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  button{font:inherit;font-size:12px;padding:5px 10px;border-radius:7px;cursor:pointer;
    background:#161b22;color:var(--fg);border:1px solid var(--line)}
  button:hover{border-color:#3d4652}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .row{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:2px 0;
    border-bottom:1px solid #161b22}
  .row b{font-weight:600}
  ul{list-style:none;padding:0;margin:0}
  li.room{display:flex;align-items:center;gap:7px;font-size:12px;padding:4px 5px;border-radius:6px;cursor:pointer}
  li.room:hover{background:#161b22}
  li.room .sw{width:10px;height:10px;border-radius:2px;flex:none}
  li.room .a{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
  #warn{margin-top:8px}
  #warn li{font-size:10.5px;color:var(--warn);margin-bottom:4px;line-height:1.35}
  #hud{position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);z-index:2;
    text-align:center;font-size:11px;color:var(--muted);padding:8px;pointer-events:none;
    text-shadow:0 1px 3px #000}
  #toggle{position:absolute;z-index:4;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;display:none}
  @media (max-width:640px){
    #panel{transform:translateX(-102%);transition:transform .2s}
    #panel.open{transform:none}
    #toggle{display:block}
  }
</style>
</head>
<body>
<button id="toggle">&#9776;</button>
<div id="panel">
  <h1 id="ttl">Gridline Scan</h1>
  <div class="sub" id="sub"></div>

  <div class="grp">
    <div class="lbl">View</div>
    <div class="btns">
      <button id="bOrbit" class="on">Orbit</button>
      <button id="bWalk">Walk inside</button>
      <button id="bTop">Top down</button>
    </div>
  </div>

  <div class="grp">
    <div class="lbl">Wall height <span id="whv"></span></div>
    <input type="range" id="wh" min="0.2" max="1" step="0.02" value="1" />
    <div class="btns" style="margin-top:8px">
      <button id="bPlan" class="on">Floor plan</button>
      <button id="bLabels" class="on">Labels</button>
    </div>
  </div>

  <div class="grp">
    <div class="lbl">Model</div>
    <div id="meta"></div>
  </div>

  <div class="grp">
    <div class="lbl">Rooms</div>
    <ul id="rooms"></ul>
  </div>

  <div class="grp">
    <div class="lbl">Accuracy notes</div>
    <ul id="warn"></ul>
  </div>

  <div class="grp">
    <div class="lbl">Load another scene</div>
    <input type="file" id="file" accept="application/json" style="font-size:11px;width:100%" />
  </div>
</div>
<div id="hud"></div>

   moves, so here is a minimal stand-in with the same surface we use. */
if (!THREE.OrbitControls) {
  THREE.OrbitControls = function(cam, dom){
    const self = this;
    this.object = cam; this.target = new THREE.Vector3();
    this.enabled = true; this.enableDamping = true; this.maxPolarAngle = Math.PI;
    let radius = 10, theta = 0, phi = 1, dragging = 0, lx = 0, ly = 0;
    this.update = function(){
      phi = Math.max(0.05, Math.min(self.maxPolarAngle, phi));
      cam.position.set(
        self.target.x + radius*Math.sin(phi)*Math.sin(theta),
        self.target.y + radius*Math.cos(phi),
        self.target.z + radius*Math.sin(phi)*Math.cos(theta));
      cam.lookAt(self.target);
    };
    // adopt whatever position was set externally
    this.sync = function(){
      const d = cam.position.clone().sub(self.target);
      radius = Math.max(0.5, d.length());
      phi = Math.acos(Math.max(-1, Math.min(1, d.y/radius)));
      theta = Math.atan2(d.x, d.z);
    };
    const origUpdate = this.update;
    this.update = function(){ if (self._dirty){ self.sync(); self._dirty = false; } origUpdate(); };
    dom.addEventListener("pointerdown", e => { if(!self.enabled) return; dragging = e.button===2?2:1; lx=e.clientX; ly=e.clientY; });
    addEventListener("pointerup", () => dragging = 0);
    dom.addEventListener("contextmenu", e => e.preventDefault());
    addEventListener("pointermove", e => {
      if (!self.enabled || !dragging) return;
      const dx = e.clientX-lx, dy = e.clientY-ly; lx=e.clientX; ly=e.clientY;
      if (dragging === 1){ theta -= dx*0.005; phi -= dy*0.005; }
      else {
        const right = new THREE.Vector3(Math.cos(theta), 0, -Math.sin(theta));
        self.target.addScaledVector(right, -dx*radius*0.001);
        self.target.z += dy*radius*0.001;
      }
      origUpdate();
    });
    dom.addEventListener("wheel", e => {
      if (!self.enabled) return;
      e.preventDefault();
      radius = Math.max(0.5, Math.min(300, radius * (1 + Math.sign(e.deltaY)*0.12)));
      origUpdate();
    }, {passive:false});
  };
  THREE.OrbitControls.prototype.constructor = THREE.OrbitControls;
}

controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.maxPolarAngle = Math.PI*0.495;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3038, 1.05));
  const sun = new THREE.DirectionalLight(0xffffff, 0.55);
  sun.position.set(12, 26, 8);
  scene.add(sun);

  addEventListener("resize", () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  document.getElementById("toggle").onclick = () =>
    document.getElementById("panel").classList.toggle("open");
  document.getElementById("bOrbit").onclick = () => setMode("orbit");
  document.getElementById("bWalk").onclick  = () => setMode("walk");
  document.getElementById("bTop").onclick   = () => { setMode("orbit"); topDown(); };
  document.getElementById("wh").oninput = e => { heightScale = +e.target.value; applyWallHeight(); };
  document.getElementById("bPlan").onclick = e => {
    if (planMesh) { planMesh.visible = !planMesh.visible; e.target.classList.toggle("on", planMesh.visible); }
  };
  document.getElementById("bLabels").onclick = e => {
    labelGroup.visible = !labelGroup.visible;
    e.target.classList.toggle("on", labelGroup.visible);
  };
  document.getElementById("file").onchange = ev => {
    const f = ev.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { data = JSON.parse(rd.result); build(data); } catch(err){ alert("Bad scene file: "+err); } };
    rd.readAsText(f);
  };
  initInput();
}

/* ---------- build the model ---------- */

function build(d){
  if (root) scene.remove(root);
  root = new THREE.Group();
  scene.add(root);
  labelGroup = new THREE.Group();
  root.add(labelGroup);

  const W = d.meta.widthM, D = d.meta.depthM;
  wallH = d.meta.wallHeightM || 2.6;

  // ground
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(W*1.6, D*1.6),
    new THREE.MeshStandardMaterial({color:0x11161d, roughness:1}));
  ground.rotation.x = -Math.PI/2;
  ground.position.set(W/2, -0.01, D/2);
  root.add(ground);

  const grid = new THREE.GridHelper(Math.max(W,D)*1.6, Math.round(Math.max(W,D)*1.6), 0x1b2430, 0x161d26);
  grid.position.set(W/2, 0, D/2);
  root.add(grid);

  // the source drawing, laid flat underneath at exactly the model's scale --
  // this is the check that the 3D geometry really matches the plan
  planMesh = null;
  if (PLAN_IMAGE && PLAN_IMAGE.length > 32) {
    const tex = new THREE.TextureLoader().load(PLAN_IMAGE);
    tex.minFilter = THREE.LinearFilter;
    planMesh = new THREE.Mesh(new THREE.PlaneGeometry(W, D),
      new THREE.MeshBasicMaterial({map:tex, transparent:true, opacity:0.82}));
    planMesh.rotation.x = -Math.PI/2;
    planMesh.position.set(W/2, 0.004, D/2);
    root.add(planMesh);
  }
  document.getElementById("bPlan").classList.toggle("on", !!planMesh);

  // room floors, from metre-space rectangles
  (d.rooms || []).forEach((r, i) => {
    const rects = r.floor || [];
    if (!rects.length) return;
    const mat = new THREE.MeshStandardMaterial({
      color: PALETTE[i % PALETTE.length], transparent:true, opacity:0.5, roughness:0.95});
    const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), mat, rects.length);
    const o = new THREE.Object3D();
    rects.forEach(([x,z,w,h], k) => {
      o.position.set(x + w/2, 0.012, z + h/2);
      o.scale.set(w, 0.02, h);
      o.updateMatrix();
      mesh.setMatrixAt(k, o.matrix);
    });
    root.add(mesh);
  });

  // walls
  wallBase = d.walls || [];
  const wmat = new THREE.MeshStandardMaterial({color:0xb6c0cb, roughness:0.92, metalness:0.02});
  wallMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), wmat, Math.max(1, wallBase.length));
  root.add(wallMesh);
  applyWallHeight();

  // labels
  (d.rooms || []).forEach((r, i) => {
    const c = centroid(r);
    const sp = makeLabel(`${r.label}  ${Math.round(r.areaSqFt || 0)} sqft`, PALETTE[i % PALETTE.length]);
    sp.position.set(c.x, 0.9, c.z);
    labelGroup.add(sp);
  });

  buildOccupancy(d);
  fillPanel(d);
  frameAll();
}

function applyWallHeight(){
  const hgt = wallH * heightScale;
  const o = new THREE.Object3D();
  wallBase.forEach(([x,z,w,h], i) => {
    o.position.set(x + w/2, hgt/2, z + h/2);
    o.scale.set(w, hgt, h);
    o.updateMatrix();
    wallMesh.setMatrixAt(i, o.matrix);
  });
  wallMesh.instanceMatrix.needsUpdate = true;
  const v = document.getElementById("whv");
  if (v) v.textContent = `${hgt.toFixed(2)} m / ${(hgt*M2FT).toFixed(1)} ft`;
}

function centroid(r){
  let ax = 0, az = 0, a = 0;
  (r.floor || []).forEach(([x,z,w,h]) => { const s = w*h; ax += (x+w/2)*s; az += (z+h/2)*s; a += s; });
  if (!a) return {x: r.xM + r.widthM/2, z: r.zM + r.depthM/2};
  return {x: ax/a, z: az/a};
}

function makeLabel(text, color){
  const c = document.createElement("canvas");
  const ctx = c.getContext("2d");
  ctx.font = "600 34px system-ui, Arial";
  c.width = Math.ceil(ctx.measureText(text).width) + 36;
  c.height = 56;
  const g = c.getContext("2d");
  g.font = "600 34px system-ui, Arial";
  g.fillStyle = "rgba(9,12,16,.82)";
  g.fillRect(0,0,c.width,c.height);
  g.fillStyle = "#" + color.toString(16).padStart(6,"0");
  g.fillRect(0,0,8,c.height);
  g.fillStyle = "#e6edf3";
  g.fillText(text, 20, 39);
  const tex = new THREE.CanvasTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, depthTest:false, transparent:true}));
  sp.scale.set(c.width/c.height * 0.75, 0.75, 1);
  return sp;
}

/* ---------- collision grid so Walk mode cannot pass through walls ---------- */

function buildOccupancy(d){
  const cell = 0.08;
  const cols = Math.ceil(d.meta.widthM / cell) + 2;
  const rows = Math.ceil(d.meta.depthM / cell) + 2;
  const g = new Uint8Array(cols * rows);
  (d.walls || []).forEach(([x,z,w,h]) => {
    const c0 = Math.floor(x/cell), c1 = Math.ceil((x+w)/cell);
    const r0 = Math.floor(z/cell), r1 = Math.ceil((z+h)/cell);
    for (let r = r0; r < r1; r++)
      for (let c = c0; c < c1; c++)
        if (c >= 0 && c < cols && r >= 0 && r < rows) g[r*cols + c] = 1;
  });
  occ = {g, cols, rows, cell};
}

function blocked(x, z){
  if (!occ) return false;
  // sample a ring at body radius, so you stop at a wall instead of clipping in
  for (let a = 0; a < 8; a++){
    const px = x + Math.cos(a*Math.PI/4)*BODY_R;
    const pz = z + Math.sin(a*Math.PI/4)*BODY_R;
    const c = Math.floor(px/occ.cell), r = Math.floor(pz/occ.cell);
    if (c < 0 || r < 0 || c >= occ.cols || r >= occ.rows) continue;
    if (occ.g[r*occ.cols + c]) return true;
  }
  return false;
}

/* ---------- camera modes ---------- */

function frameAll(){
  const W = data.meta.widthM, D = data.meta.depthM;
  controls.target.set(W/2, 0, D/2);
  camera.position.set(W/2 - W*0.35, Math.max(W,D)*0.72, D*1.25);
  controls._dirty = true; controls.update();
}
function topDown(){
  const W = data.meta.widthM, D = data.meta.depthM;
  controls.target.set(W/2, 0, D/2);
  camera.position.set(W/2, Math.max(W,D)*1.15, D/2 + 0.01);
  controls._dirty = true; controls.update();
}
function setMode(m){
  mode = m;
  controls.enabled = (m === "orbit");
  document.getElementById("bOrbit").classList.toggle("on", m === "orbit");
  document.getElementById("bWalk").classList.toggle("on", m === "walk");
  if (m === "walk"){
    // drop in at the middle of the largest room, standing on the floor
    let best = null, ba = -1;
    (data.rooms || []).forEach(r => { if ((r.areaM2||0) > ba){ ba = r.areaM2; best = r; } });
    const c = best ? centroid(best) : {x:data.meta.widthM/2, z:data.meta.depthM/2};
    camera.position.set(c.x, EYE_H, c.z);
    yaw = 0; pitch = 0;
    document.getElementById("wh").value = 1;
    heightScale = 1; applyWallHeight();
  }
  hud();
}

/* ---------- input ---------- */

const keys = {};
let yaw = 0, pitch = 0, dragging = false, lastX = 0, lastY = 0;

function initInput(){
  addEventListener("keydown", e => {
    keys[e.code] = true;
    if (mode === "walk" && ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  });
  addEventListener("keyup", e => keys[e.code] = false);
  const el = renderer.domElement;
  el.addEventListener("pointerdown", e => { if (mode==="walk"){ dragging = true; lastX = e.clientX; lastY = e.clientY; } });
  addEventListener("pointerup", () => dragging = false);
  addEventListener("pointermove", e => {
    if (mode !== "walk" || !dragging) return;
    yaw   -= (e.clientX - lastX) * 0.0045;
    pitch -= (e.clientY - lastY) * 0.0045;
    pitch = Math.max(-1.2, Math.min(1.2, pitch));
    lastX = e.clientX; lastY = e.clientY;
  });
}

function walkStep(dt){
  const speed = (keys.ShiftLeft || keys.ShiftRight ? 3.2 : 1.5) * dt;
  let f = 0, s = 0;
  if (keys.KeyW || keys.ArrowUp) f += 1;
  if (keys.KeyS || keys.ArrowDown) f -= 1;
  if (keys.KeyD || keys.ArrowRight) s += 1;
  if (keys.KeyA || keys.ArrowLeft) s -= 1;
  const dir = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  let nx = camera.position.x - dir.x*f*speed + right.x*s*speed;
  let nz = camera.position.z - dir.z*f*speed + right.z*s*speed;
  // try the full move, then each axis alone, so you slide along a wall
  if (!blocked(nx, nz)) { camera.position.x = nx; camera.position.z = nz; }
  else if (!blocked(nx, camera.position.z)) camera.position.x = nx;
  else if (!blocked(camera.position.x, nz)) camera.position.z = nz;
  camera.position.y = EYE_H;
  const look = new THREE.Vector3(
    camera.position.x - Math.sin(yaw)*Math.cos(pitch),
    camera.position.y + Math.sin(pitch),
    camera.position.z - Math.cos(yaw)*Math.cos(pitch));
  camera.lookAt(look);
}

/* ---------- panel ---------- */

function fillPanel(d){
  document.getElementById("ttl").textContent = d.source_image || "Floor plan";
  document.getElementById("sub").textContent =
    `${d.meta.widthM} x ${d.meta.depthM} m  (${(d.meta.widthM*M2FT).toFixed(1)} x ${(d.meta.depthM*M2FT).toFixed(1)} ft)`;

  const meta = document.getElementById("meta");
  meta.innerHTML = "";
  [["Scale", `${d.meta.pixelsPerMetre} px/m`],
   ["Rooms", d.meta.roomCount],
   ["Wall pieces", d.meta.wallRectCount != null ? d.meta.wallRectCount : (d.walls||[]).length],
   ["Wall height", `${(d.meta.wallHeightM||2.6).toFixed(2)} m`]
  ].forEach(([k,v]) => {
    const div = document.createElement("div");
    div.className = "row";
    div.innerHTML = `<span>${k}</span><b>${v}</b>`;
    meta.appendChild(div);
  });

  const ul = document.getElementById("rooms");
  ul.innerHTML = "";
  (d.rooms || []).forEach((r, i) => {
    const li = document.createElement("li");
    li.className = "room";
    const hex = "#" + PALETTE[i % PALETTE.length].toString(16).padStart(6,"0");
    const clear = (r.clearWidthM && r.clearDepthM)
      ? `${ftin(r.clearWidthM)} x ${ftin(r.clearDepthM)}` : "";
    li.innerHTML = `<span class="sw" style="background:${hex}"></span>
      <span>${r.label}<br><span style="color:var(--muted);font-size:10.5px">${clear}</span></span>
      <span class="a">${Math.round(r.areaSqFt||0)} sqft</span>`;
    li.onclick = () => focusRoom(r);
    ul.appendChild(li);
  });

  const w = document.getElementById("warn");
  w.innerHTML = "";
  (d.meta.warnings || []).forEach(t => {
    const li = document.createElement("li");
    li.textContent = "\u26A0 " + t;
    w.appendChild(li);
  });
  hud();
}

function ftin(m){
  const total = m * 39.3701;
  const ft = Math.floor(total/12), inch = Math.round(total - ft*12);
  return inch === 12 ? `${ft+1}'0"` : `${ft}'${inch}"`;
}

function focusRoom(r){
  const c = centroid(r);
  if (mode === "walk"){ camera.position.set(c.x, EYE_H, c.z); return; }
  controls.target.set(c.x, 0, c.z);
  const span = Math.max(r.widthM || 3, r.depthM || 3);
  camera.position.set(c.x - span*0.6, span*1.5, c.z + span*1.2);
  controls._dirty = true; controls.update();
}

function hud(){
  document.getElementById("hud").textContent = mode === "walk"
    ? "Walk: W A S D or arrows to move, hold Shift to run, drag to look around. Eye height 1.6 m."
    : "Orbit: drag to rotate, scroll to zoom, right-drag to pan. Switch to Walk inside to stand in it.";
}

/* ---------- loop ---------- */

let prev = performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min(0.05, (now - prev)/1000);
  prev = now;
  if (mode === "walk") walkStep(dt);
  else controls.update();
  renderer.render(scene, camera);
}
</script>
</body>
</html>
